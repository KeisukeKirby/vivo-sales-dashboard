<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vivo Sales Dashboard</title>
  <meta name="description" content="Vivo sales by company (BFT / EDV) and sales location">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23eb6834'/><rect x='7' y='16' width='4' height='9' rx='1.5' fill='white'/><rect x='14' y='10' width='4' height='15' rx='1.5' fill='white'/><rect x='21' y='13' width='4' height='12' rx='1.5' fill='white'/></svg>">
  <link rel="stylesheet" href="style.css?v=20261001">
  <link rel="stylesheet" href="vivo.css?v=20261001">
</head>
<body>
  <div class="page vivo">
    <header class="top">
      <div>
        <p class="eyebrow">Vivo Sales Dashboard</p>
        <h1 data-i18n="h1"></h1>
        <p class="sub"><span id="period" data-i18n="loading"></span><span class="dot">·</span><span id="source"></span></p>
      </div>
      <div class="top-actions">
        <div class="lang-switch" role="group" data-i18n-aria="lang.aria">
          <button type="button" data-lang="ja" lang="ja">日本語</button>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="th" lang="th">ไทย</button>
        </div>
        <button id="themeToggle" class="ghost" type="button" data-i18n-aria="theme.aria">
          <span aria-hidden="true">◐</span> <span id="themeLabel"></span>
        </button>
      </div>
    </header>

    <section class="card vf" role="search" data-i18n-aria="f.aria">
      <div class="vf-row">
        <div class="vf-group">
          <span class="vf-label" data-i18n="f.company"></span>
          <div class="seg" id="segCompany">
            <button type="button" data-v="" data-i18n="all"></button>
            <button type="button" data-v="BFT">BFT</button>
            <button type="button" data-v="EDV">EDV</button>
          </div>
        </div>
        <div class="vf-group vf-locs">
          <span class="vf-label"><span data-i18n="f.loc"></span> <span class="hint" data-i18n="f.locHint"></span></span>
          <div class="loc-chips" id="locChips"></div>
        </div>
        <label class="vf-group">
          <span class="vf-label" data-i18n="f.from"></span>
          <input type="date" id="dFrom" class="vf-input">
        </label>
        <label class="vf-group">
          <span class="vf-label" data-i18n="f.to"></span>
          <input type="date" id="dTo" class="vf-input">
        </label>
        <label class="vf-group">
          <span class="vf-label" data-i18n="f.model"></span>
          <select id="fModel" class="vf-input"></select>
        </label>
        <button id="reset" class="ghost" type="button" data-i18n="reset"></button>
      </div>
    </section>

    <section class="card mcard">
      <div class="mcard-head">
        <div>
          <h2 data-i18n="m.title"></h2>
          <p class="hint" data-i18n="m.hint"></p>
        </div>
        <div class="mtotal">
          <p class="mtotal-label" data-i18n="kpi.qty"></p>
          <p class="mtotal-value" id="kQty">–</p>
          <p class="kpi-note" id="kQtyNote"></p>
        </div>
      </div>
      <div id="modelList" class="mlist"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span data-i18n="t.title"></span><span id="tTitleModel"></span> <span class="count" id="tCount"></span></h2>
        <div class="head-actions">
          <button id="copyTable" class="ghost small" type="button" data-i18n="copy"></button>
          <button id="dlCsv" class="ghost small" type="button" data-i18n="csv"></button>
        </div>
      </div>
      <div class="vtable-wrap">
        <table class="vtable">
          <thead id="tHead"></thead>
          <tbody id="tBody"></tbody>
          <tfoot id="tFoot"></tfoot>
        </table>
      </div>
    </section>

    <footer class="foot" id="foot"></footer>
  </div>
  <script src="vivo.js?v=20261001"></script>
</body>
</html>
